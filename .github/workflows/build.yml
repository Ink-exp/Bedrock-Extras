name: Build and Release Bedrock Extras

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build ARM64 Shared Library
        run: |
          cmake -B build \
                -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-28
          cmake --build build --parallel

      - name: Package Plugin ZIP
        run: |
          mkdir -p output
          cp build/libbedrock_extras.so output/
          cp manifest.json output/
          cd output && zip -r ../BedrockExtras-v1.0.zip *

      # --- SUCCESS HANDLING ---
      - name: Upload Build Artifact (Always Available)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BedrockExtras-v1.0
          path: BedrockExtras-v1.0.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: BedrockExtras-v1.0.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Success
        if: success()
        run: echo "✅ Build completed successfully! BedrockExtras-v1.0.zip is ready."

      # --- FAILURE HANDLING ---
      - name: Handle Build Failure
        if: failure()
        run: |
          echo "❌ BUILD FAILED!"
          echo "Please check the C++ code or CMake build logs above for details."
