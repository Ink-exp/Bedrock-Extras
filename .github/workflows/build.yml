name: Build and Release Bedrock Extras

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build ARM64 Shared Library
        run: |
          cmake -B build \
                -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-28
          cmake --build build --parallel

      - name: Package Plugin ZIP
        run: |
          mkdir -p output
          cp build/libbedrock_extras.so output/
          cp manifest.json output/
          cd output && zip -r ../BedrockExtras.zip *

      # Always upload artifact so you can download it from the Actions run tab directly
      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BedrockExtras-Latest
          path: BedrockExtras.zip

      # Automated GitHub Release creation
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && github.event_name == 'push'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Bedrock_Extras' }}
          draft: false
          prerelease: false
          files: BedrockExtras.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
