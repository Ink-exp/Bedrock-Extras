name: Build Production Native Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build ARM64 Shared Library
        run: |
          cmake -B build \
                -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-28
          cmake --build build --parallel

      - name: Package Plugin ZIP
        run: |
          mkdir -p output
          cp build/libbedrock_extras.so output/
          cp manifest.json output/
          cd output && zip -r ../BedrockExtras.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BedrockExtras-Functional
          path: BedrockExtras.zip
